<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Kalkulator Preventive Maintenance</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      padding: 20px;
      color: #333;
    }
    h1 {
      text-align: center;
      color: #1976d2;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 20px;
    }
    th, td {
      border: 1px solid #ccc;
      padding: 10px;
      text-align: center;
    }
    th {
      background-color: #e3f2fd;
    }
    input {
      width: 80px;
      padding: 5px;
      text-align: right;
    }
    .button {
      display: block;
      margin: 20px auto;
      padding: 10px 20px;
      background: #1976d2;
      color: white;
      border: none;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
    }
    .button:hover {
      background-color: #1565c0;
    }
    @media (max-width: 600px) {
      input {
        width: 60px;
      }
    }
  </style>
</head>
<body>
  <h1>Kalkulator Disk Untuk Preventive Maintenance</h1>
  <table>
    <thead>
      <tr>
        <th>Disk</th>
        <th>Full</th>
        <th>Sisa</th>
        <th>Used</th>
        <th>Persen (%)</th>
      </tr>
    </thead>
    <tbody id="table-body">
      <tr>
        <td>C</td>
        <td><input type="number" step="0.1" value="0" class="full"></td>
        <td><input type="number" step="0.1" value="0" class="kepake"></td>
        <td class="sisa">-</td>
        <td class="persen">-</td>
      </tr>
      <tr>
        <td>D</td>
        <td><input type="number" step="0.1" value="0" class="full"></td>
        <td><input type="number" step="0.1" value="0" class="kepake"></td>
        <td class="sisa">-</td>
        <td class="persen">-</td>
      </tr>
      <tr>
        <td>E</td>
        <td><input type="number" step="0.1" value="0" class="full"></td>
        <td><input type="number" step="0.1" value="0" class="kepake"></td>
        <td class="sisa">-</td>
        <td class="persen">-</td>
      </tr>
    </tbody>
  </table>
  <button class="button" onclick="hitung()">Hitung</button>

  <script>
    function hitung() {
      const rows = document.querySelectorAll("#table-body tr");

      rows.forEach(row => {
        const fullInput = row.querySelector(".full");
        const kepakeInput = row.querySelector(".sisa);
        const sisaCell = row.querySelector(".kepake");
        const persenCell = row.querySelector(".persen");

        const full = parseFloat(fullInput.value);
        const kepake = parseFloat(kepakeInput.value);

        if (!isNaN(full) && !isNaN(kepake)) {
          const sisa = full - kepake;
          const persen = (kepake / full) * 100;

          sisaCell.textContent = sisa.toFixed(1);
          persenCell.textContent = persen.toFixed(2) + "%";
        } else {
          sisaCell.textContent = "-";
          persenCell.textContent = "-";
        }
      });
    }

    window.onload = hitung;
  </script>
</body>
</html>
